name: watch-screenshots
on:
  push:
    branches: ["**"]
permissions:
  contents: read
# Org runners are shared: a newer push to the same PR cancels the older run; on main a burst of pending
# runs collapses to the newest, and a run already in progress on main is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  screenshots:
    if: contains(github.event.head_commit.message, '[watch-screenshots]')
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Capture the running Watch app
        run: python3 scripts/watch-screenshots.py "$RUNNER_TEMP/watch-screenshots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watch-screenshots
          path: ${{ runner.temp }}/watch-screenshots
          if-no-files-found: error
