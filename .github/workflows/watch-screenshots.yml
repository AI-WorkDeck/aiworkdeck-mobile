name: watch-screenshots
on:
  push:
    branches: ["**"]
permissions:
  contents: read
jobs:
  screenshots:
    if: contains(github.event.head_commit.message, '[watch-screenshots]')
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Capture the running Watch app
        run: python3 scripts/watch-screenshots.py "$RUNNER_TEMP/watch-screenshots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watch-screenshots
          path: ${{ runner.temp }}/watch-screenshots
          if-no-files-found: error
