name: android
on:
  push:
    branches: [main]
    paths: ["android/**", "third_party/libfvad/**", "contract/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "third_party/libfvad/**", "contract/**", ".github/workflows/android.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
        with:
          # SDK 源端已下线 `tools` 包，action 默认 packages 含它会让 sdkmanager 退 1（dev-board#668）
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testIntlDebugUnitTest :app:testCnDebugUnitTest :app:assembleIntlDebug :app:assembleCnDebug --console=plain
      - name: 大陆变体不得含 GMS
        # 校验发版用的 release 配置；管道两端都要判：gradle 自己挂掉时 grep 找不到 GMS 也会「通过」
        run: |
          set -o pipefail
          out=$(./gradlew :app:dependencies --configuration cnReleaseRuntimeClasspath --console=plain) && ! grep -q "com.google.android.gms" <<<"$out"
