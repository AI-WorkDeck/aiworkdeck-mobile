name: contract
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Org runners are shared: a newer push to the same PR cancels the older run; on main a burst of pending
# runs collapses to the newest, and a run already in progress on main is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run security:dependencies
      - run: node contract/tools/check.mjs
      - run: node scripts/check-palette.mjs
      - run: npm run typecheck
      - run: npm test
