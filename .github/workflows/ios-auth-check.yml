name: ios-auth-check
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths: ['ios/**', 'contract/**', 'fastlane/Fastfile', 'fastlane/tests/**', 'scripts/check-ios-*.py', 'scripts/create-ios-ci-simulator.py', 'scripts/tests/test_ios_*.py', '.github/workflows/ios-auth-check.yml', '.github/workflows/appstore-build.yml']
  pull_request:
    # Simulators on a PR only when it carries the `full-build` label (adding the label starts the run);
    # every push to main and the App Store gate always run them.
    types: [opened, synchronize, reopened, labeled]
    paths: ['ios/**', 'contract/**', 'fastlane/Fastfile', 'fastlane/tests/**', 'scripts/check-ios-*.py', 'scripts/create-ios-ci-simulator.py', 'scripts/tests/test_ios_*.py', '.github/workflows/ios-auth-check.yml', '.github/workflows/appstore-build.yml']
permissions:
  contents: read
# macOS jobs are limited per organization. A newer push to the same PR cancels the older run; pending
# main pushes collapse to the newest. When appstore-build calls this as its release gate, github.workflow
# is the caller's name, so the gate gets its own group and is never collapsed or cancelled.
concurrency:
  group: ios-auth-${{ github.event.pull_request.number || (github.workflow == 'ios-auth-check' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Every PR that reaches this workflow (it touches ios/** or contract/**, see paths above) runs the iOS unit
  # tests on one iPhone simulator. They are fast and catch contract-string expectations (mobile#168 broke main
  # unseen because PRs skipped iOS). The UI suites stay behind the `full-build` label and on main.
  unit:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-build') && github.event.action != 'labeled'
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Unit tests on an isolated compatible simulator
        working-directory: ios
        run: |
          DEVICE_ID=$(python3 ../scripts/create-ios-ci-simulator.py iphone)
          trap 'xcrun simctl delete "$DEVICE_ID"' EXIT
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild test -scheme Workdeck -parallel-testing-enabled NO -collect-test-diagnostics never -destination "platform=iOS Simulator,id=$DEVICE_ID" -only-testing:WorkdeckTests CODE_SIGNING_ALLOWED=NO
  simulator:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-build')
    runs-on: xcode-27
    timeout-minutes: 100
    # The large-iPhone runner fails for environmental reasons (empty accessibility
    # trees, app launch failures, timeouts) while the same tests pass locally on the
    # same device and runtime. It still runs and reports, but does not block the
    # App Store upload gate; iphone and duo remain blocking. Tracked in the mobile
    # repo issue "iOS CI: large-iPhone simulator flakiness".
    continue-on-error: ${{ matrix.device == 'iphone-large' }}
    strategy:
      fail-fast: false
      matrix:
        # PRs run the two blocking devices; the non-blocking large iPhone runs on main and releases.
        device: ${{ fromJSON(github.event_name == 'pull_request' && '["iphone","duo"]' || '["iphone","iphone-large","duo"]') }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify release toolchain and guard regressions
        run: |
          python3 scripts/check-ios-release.py environment
          python3 -m unittest discover -s scripts/tests -p 'test_ios_*.py' -v
          ruby fastlane/tests/local_signing_test.rb
      - name: Install Duo runtime
        if: matrix.device == 'duo'
        run: |
          if ! python3 scripts/create-ios-ci-simulator.py duo --check-only; then
            xcodebuild -downloadPlatform iOS -buildVersion 27.1 -architectureVariant arm64
          fi
          python3 scripts/create-ios-ci-simulator.py duo --check-only
      - run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Test on an isolated compatible simulator
        working-directory: ios
        run: |
          DEVICE_ID=$(python3 ../scripts/create-ios-ci-simulator.py '${{ matrix.device }}')
          trap 'xcrun simctl delete "$DEVICE_ID"' EXIT
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          TESTS=(
            -only-testing:WorkdeckUITests/SubscriptionFlowTests
            -only-testing:WorkdeckTests
            -only-testing:WorkdeckUITests/LoginFlowTests
            -only-testing:WorkdeckUITests/DuoSecondaryScreensTests
            -only-testing:WorkdeckUITests/DuoWorkspaceContinuityTests
            -only-testing:WorkdeckUITests/PersonalWorkspaceFlowTests
            -only-testing:WorkdeckUITests/FirmFixtureShotsTests
          )
          # XCUIDevice.orientation does not change Duo's physical pose in DeviceHub.
          # Exercise those rotations on iPhone; Duo pose/split-view acceptance is
          # recorded separately with the active inner display before release.
          if [ '${{ matrix.device }}' != duo ]; then
            TESTS+=(
              -only-testing:WorkdeckUITests/RecordingFlowTests
              -only-testing:WorkdeckUITests/CrossScreenRotationTests
              -only-testing:WorkdeckUITests/CaptureContinuityTests
              -only-testing:WorkdeckUITests/WorkspaceFlowTests/testCaptureLayoutSurvivesRepeatedRotationAndProjectEntry
              -only-testing:WorkdeckUITests/WorkspaceFlowTests/testLandscapeLoginControlsRemainReachableAfterShowingKeyboard
              -only-testing:WorkdeckUITests/WorkspaceFlowTests/testProjectFilesQuotePreviewAndRotationContinuity
            )
          else
            TESTS+=(
              -only-testing:WorkdeckUITests/RecordingFlowTests/testPausedAudioIsObviousAndCanResumeAndPauseAgain
              -only-testing:WorkdeckUITests/RecordingFlowTests/testPausedVideoIsObviousAndCanResumeAndPauseAgain
              -only-testing:WorkdeckUITests/RecordingFlowTests/testSilenceReminderOffersSaveAndContinuesWithoutStopping
              -only-testing:WorkdeckUITests/RecordingFlowTests/testUnassignedRecordingSettingsBackAndMove
              -only-testing:WorkdeckUITests/RecordingFlowTests/testTerminatedRecordingReportsRecoveryWithoutRestarting
            )
          fi
          xcodebuild test -scheme Workdeck -parallel-testing-enabled NO -retry-tests-on-failure -test-iterations 2 -collect-test-diagnostics never -test-timeouts-enabled YES -default-test-execution-time-allowance 900 -maximum-test-execution-time-allowance 900 -destination "platform=iOS Simulator,id=$DEVICE_ID" "${TESTS[@]}" CODE_SIGNING_ALLOWED=NO -resultBundlePath "$RUNNER_TEMP/auth-tests.xcresult"
      - name: Export simulator screenshots and recordings
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/auth-tests.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/auth-tests.xcresult" --output-path "$RUNNER_TEMP/auth-attachments"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-auth-attachments-${{ matrix.device }}
          path: ${{ runner.temp }}/auth-attachments
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-auth-tests-${{ matrix.device }}
          path: ${{ runner.temp }}/auth-tests.xcresult
