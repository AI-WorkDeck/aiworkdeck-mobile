name: ios-auth-check
on:
  workflow_dispatch:
  pull_request:
    paths: ['ios/**', 'contract/**', 'fastlane/Fastfile', 'scripts/check-ios-release.py', 'scripts/create-ios-ci-simulator.py', 'scripts/tests/test_ios_release.py', '.github/workflows/ios-auth-check.yml', '.github/workflows/appstore-build.yml']
permissions:
  contents: read
jobs:
  simulator:
    runs-on: xcode-27
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, duo]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify release toolchain and guard regressions
        run: |
          python3 scripts/check-ios-release.py environment
          python3 -m unittest discover -s scripts/tests -p test_ios_release.py -v
      - name: Install Duo runtime
        if: matrix.device == 'duo'
        run: |
          if ! python3 scripts/create-ios-ci-simulator.py duo --check-only; then
            xcodebuild -downloadPlatform iOS -buildVersion 27.1 -architectureVariant arm64
          fi
          python3 scripts/create-ios-ci-simulator.py duo --check-only
      - run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Test on an isolated compatible simulator
        working-directory: ios
        run: |
          DEVICE_ID=$(python3 ../scripts/create-ios-ci-simulator.py '${{ matrix.device }}')
          trap 'xcrun simctl delete "$DEVICE_ID"' EXIT
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          TESTS=(
            -only-testing:WorkdeckTests
            -only-testing:WorkdeckUITests/LoginFlowTests
            -only-testing:WorkdeckUITests/DuoSecondaryScreensTests
            -only-testing:WorkdeckUITests/DuoWorkspaceContinuityTests
            -only-testing:WorkdeckUITests/PersonalWorkspaceFlowTests
          )
          # XCUIDevice.orientation does not change Duo's physical pose in DeviceHub.
          # Exercise those rotations on iPhone; Duo pose/split-view acceptance is
          # recorded separately with the active inner display before release.
          if [ '${{ matrix.device }}' = iphone ]; then
            TESTS+=(
              -only-testing:WorkdeckUITests/CrossScreenRotationTests
              -only-testing:WorkdeckUITests/CaptureContinuityTests
              -only-testing:WorkdeckUITests/WorkspaceFlowTests/testCaptureLayoutSurvivesRepeatedRotationAndProjectEntry
              -only-testing:WorkdeckUITests/WorkspaceFlowTests/testLandscapeLoginControlsRemainReachableAfterShowingKeyboard
              -only-testing:WorkdeckUITests/WorkspaceFlowTests/testProjectFilesQuotePreviewAndRotationContinuity
            )
          fi
          xcodebuild test -scheme Workdeck -parallel-testing-enabled NO -collect-test-diagnostics never -test-timeouts-enabled YES -default-test-execution-time-allowance 900 -maximum-test-execution-time-allowance 900 -destination "platform=iOS Simulator,id=$DEVICE_ID" "${TESTS[@]}" CODE_SIGNING_ALLOWED=NO -resultBundlePath "$RUNNER_TEMP/auth-tests.xcresult"
      - name: Export simulator screenshots and recordings
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/auth-tests.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/auth-tests.xcresult" --output-path "$RUNNER_TEMP/auth-attachments"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-auth-attachments-${{ matrix.device }}
          path: ${{ runner.temp }}/auth-attachments
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-auth-tests-${{ matrix.device }}
          path: ${{ runner.temp }}/auth-tests.xcresult
