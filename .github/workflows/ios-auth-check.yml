name: ios-auth-check
on:
  workflow_dispatch:
  pull_request:
    paths: ['ios/**', 'contract/**', '.github/workflows/ios-auth-check.yml']
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Test on an available iPhone simulator
        working-directory: ios
        run: |
          xcodebuild -version
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          DEVICE_ID=$(python3 - "$RUNNER_TEMP/simulators.json" <<'PYTHON'
          import json, re, sys
          devices = json.load(open(sys.argv[1]))["devices"]
          candidates = [(runtime, device) for runtime, group in devices.items() for device in group if "iPhone" in device["name"]]
          runtime, device = max(candidates, key=lambda item: ("Pro Max" in item[1]["name"], tuple(map(int, re.findall(r"\d+", item[0])))))
          print(f"Testing {device['name']} on {runtime}", file=sys.stderr)
          print(device["udid"])
          PYTHON
          )
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild test -scheme Workdeck -parallel-testing-enabled NO -collect-test-diagnostics never -test-timeouts-enabled YES -default-test-execution-time-allowance 900 -maximum-test-execution-time-allowance 900 -destination "platform=iOS Simulator,id=$DEVICE_ID" -only-testing:WorkdeckTests -only-testing:WorkdeckUITests/LoginFlowTests -only-testing:WorkdeckUITests/CrossScreenRotationTests -only-testing:WorkdeckUITests/WorkspaceFlowTests/testCaptureLayoutSurvivesRepeatedRotationAndProjectEntry -only-testing:WorkdeckUITests/WorkspaceFlowTests/testLandscapeLoginControlsRemainReachableAfterShowingKeyboard CODE_SIGNING_ALLOWED=NO -resultBundlePath "$RUNNER_TEMP/auth-tests.xcresult"
      - name: Export simulator screenshots and recordings
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/auth-tests.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/auth-tests.xcresult" --output-path "$RUNNER_TEMP/auth-attachments"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-auth-attachments
          path: ${{ runner.temp }}/auth-attachments
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-auth-tests
          path: ${{ runner.temp }}/auth-tests.xcresult
