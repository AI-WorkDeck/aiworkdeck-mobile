# 正式包为什么在 CI 打：本机 macOS 是 beta 时，包里 BuildMachineOSBuild 带 beta
# 系统号，提审必被 ITMS-90111 打回（Xcode/SDK 是正式版也没用）。细节与环境契约
# 见 fastlane/Fastfile 的 ci_appstore 注释。
#
# 触发：push 且 commit message 含 [appstore]（macOS runner 一次约 20 分钟，
# 不值得每次 push 都跑）。
name: appstore-build
on:
  push:
    branches: ["**"]
permissions:
  contents: read
jobs:
  build-upload:
    if: contains(github.event.head_commit.message, '[appstore]')
    # Serialize build-number allocation and upload; never cancel an active release.
    concurrency:
      group: appstore-upload
      cancel-in-progress: false
    # macos-latest still ships Xcode 26.6. The Xcode 27 image has the release
    # 27.1 toolchain (27A9275), even if its resolved directory contains "RC".
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 检查发行版系统、Xcode 与 iOS SDK（至少 27.1）
        run: python3 scripts/check-ios-release.py environment

      - name: 安装 xcodegen 与 fastlane
        run: |
          brew install xcodegen
          which fastlane || brew install fastlane

      - name: 落签名材料到 RUNNER_TEMP
        env:
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
          DIST_P12_B64: ${{ secrets.DIST_P12_B64 }}
          APPSTORE_PROFILE_B64: ${{ secrets.APPSTORE_PROFILE_B64 }}
          LA_PROFILE_B64: ${{ secrets.LA_PROFILE_B64 }}
          WATCH_PROFILE_B64: ${{ secrets.WATCH_PROFILE_B64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$ASC_KEY_P8_B64"       | base64 -d > "$RUNNER_TEMP/signing/asc.p8"
          echo "$DIST_P12_B64"         | base64 -d > "$RUNNER_TEMP/signing/dist.p12"
          echo "$APPSTORE_PROFILE_B64" | base64 -d > "$RUNNER_TEMP/signing/appstore.mobileprovision"
          # Live Activity 扩展的描述文件（dev-board#404）。secret 缺失时不落文件，
          # Fastfile 走「不存在」分支——但归档会在 exportArchive 失败，这是预期。
          if [ -n "$LA_PROFILE_B64" ]; then
            echo "$LA_PROFILE_B64" | base64 -d > "$RUNNER_TEMP/signing/la.mobileprovision"
          fi
          if [ -z "$WATCH_PROFILE_B64" ]; then
            echo "::error::缺少 WATCH_PROFILE_B64，无法签名随 iOS App 嵌入的 Watch App"
            exit 1
          fi
          echo "$WATCH_PROFILE_B64" | base64 -d > "$RUNNER_TEMP/signing/watch.mobileprovision"

      - name: 打包并上传
        env:
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/signing/asc.p8"
          export DIST_P12_PATH="$RUNNER_TEMP/signing/dist.p12"
          export APPSTORE_PROFILE_PATH="$RUNNER_TEMP/signing/appstore.mobileprovision"
          export WATCH_PROFILE_PATH="$RUNNER_TEMP/signing/watch.mobileprovision"
          if [ -f "$RUNNER_TEMP/signing/la.mobileprovision" ]; then
            export LA_PROFILE_PATH="$RUNNER_TEMP/signing/la.mobileprovision"
          fi
          # 2026-09-05 起 iOS 只剩这一个 App（另一条 App 记录已删，dev-board#445/#446）
          fastlane ios ci_appstore
