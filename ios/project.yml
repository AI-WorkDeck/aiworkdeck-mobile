name: Workdeck
options:
  bundleIdPrefix: com.aiworkdeck
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.8.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: 8WKHZVR2W8        # 北京京微资易科技有限公司；iOS 只有这一个发布主体
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
# 签名设置必须写在 target 上，不能写在这里：
# 项目级的 CODE_SIGN_IDENTITY 会被目标级默认值（iPhone Developer）压掉，
# 表现是 CODE_SIGN_STYLE 和描述文件都生效了、唯独身份还是 Developer，
# 然后报「profile doesn't include signing certificate」。见 targetTemplates.WorkdeckApp.settings。

# App 的构建设置与 Info.plist 全收在这个模板里，target 上只留 bundle id 与描述文件，
# 避免 purpose string 之类的东西改一处漏一处。
# （2026-09-05 之前这里还有第二个 App target 与它共用同一份模板；那条 App
#  记录已删，模板保留原样，见 dev-board#446。）
targetTemplates:
  WorkdeckApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: WatchShared
      - path: Resources
      # Live Activity 的属性与停止意图，与扩展共用同一份源码（见 LiveActivityExt）
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: Workdeck
        TARGETED_DEVICE_FAMILY: "1"
        # 少了这条，altool 会以 90713「Missing CFBundleIconName」拒收整个包，
        # 而本地构建、归档、签名全都不会报错。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 显式声明全局强调色（Assets.xcassets/AccentColor.colorset），配合下面
        # UILaunchScreen 的 UIColorName 同理：给了显式 Info.plist 路径后自动检测
        # 这条不保证生效，未编译验证过，稳妥起见显式写上（dev-board#731）。
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # 模拟器开发：不签名，省掉每次跑都要解锁 keychain。
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGNING_ALLOWED: NO
        # 发版：手动签名。本账号 0 台注册用于开发的设备，自动签名在归档阶段
        # 会去要 Development profile 然后撞死（No profiles for ... were found）。
        # 描述文件名见各 target 的 PROVISIONING_PROFILE_SPECIFIER。
        Release:
          CODE_SIGN_STYLE: Manual
          # 带 [sdk=iphoneos*] 的这条才是真正生效的那个；不带限定的压不住
          # Xcode 默认的 "iPhone Developer"。
          CODE_SIGN_IDENTITY: "Apple Distribution"
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: AI WorkDeck
        ITSAppUsesNonExemptEncryption: false

        # 这几条必须写在 plist 里，不能用 INFOPLIST_KEY_* 构建设置：
        # 那组设置只对「自动生成 Info.plist」的流程生效，一旦像这里给了显式
        # plist 路径就完全不合并，静默失效。少了 UILaunchScreen 的表现是
        # 整个 App 被降级到兼容尺寸letterbox——顶部一条黑带、底部内容被切。
        # 空字典走系统默认背景（纯白），与 App 自己浅色下的玉脂白背景不是同一个白，
        # 启动到首屏之间会闪一下；配上 UIColorName 让启动屏直接用 App 的背景色
        # （Assets.xcassets/LaunchBackground.colorset，浅色玉脂白 / 深色 D.bg，dev-board#731）。
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # 工作区与采集界面按实际空间布局，允许横屏与展开后的窗口变化。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

        # 录音退后台 / 锁屏继续录（dev-board#404）。只有录音需要：录像是前台动作，
        # iOS 也不允许后台用摄像头。
        UIBackgroundModes:
          - audio
        # 录音中的灵动岛 + 锁屏卡片，视图在 WorkdeckLiveActivity 扩展里
        NSSupportsLiveActivities: true

        # 英文设备的权限说明在 Resources/en.lproj/InfoPlist.strings（dev-board#837）；
        # 中文另有 Resources/zh-Hans.lproj 一份同文，改这里的中文要同步改那两份。
        # Apple 的 purpose string 是 SDK 链接期强制，不是运行期强制：
        # 只要二进制链接到引用了受限 API 的 SDK 就必须声明，否则 ITMS-90683 直接拒。
        # Claws 在这上面被拒过一次 build，这里一次写全。
        NSCameraUsageDescription: >-
          拍摄现场资料与取证影像。原图保存在本应用内；「同时存入系统相册」开启时（默认开启）会另存一份到系统相册，可在设置中关闭。
        NSMicrophoneUsageDescription: >-
          现场录音取证与录像收声都需要使用麦克风，录到的声音只作为取证记录保存。
        NSLocationWhenInUseUsageDescription: >-
          记录每张影像的拍摄地点，写入归档信息。仅在拍摄时读取一次，不做后台定位。
        NSPhotoLibraryAddUsageDescription: >-
          「同时存入系统相册」开启时（默认开启），把拍摄的照片和录像另存一份到系统相册；可在设置中关闭。

  # 录音 Live Activity 的 WidgetKit 扩展（dev-board#404）。扩展里只编：共享的属性与
  # 停止意图、卡片视图、以及 tr() 所需的词典与令牌（L10n + 生成物 Strings/Tokens +
  # Typography），不带 App 的其它代码——扩展进程里从不做录音本身。
  LiveActivityExt:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: LiveActivity
      - path: Sources/Contract/Strings.swift
      - path: Sources/Contract/Tokens.swift
      - path: Sources/Design/L10n.swift
      - path: Sources/Design/Typography.swift
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        # 签名策略同 WorkdeckApp：模拟器不签，发版手动 Distribution。
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGNING_ALLOWED: NO
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"
    info:
      path: Info-LiveActivity.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: AI WorkDeck
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

targets:
  # App target 必须显式声明 scheme：不声明的话 XcodeGen 不落 xcshareddata/xcschemes，
  # xcodebuild 只好走隐式 scheme 解析，名字对不上时会解析到别的 target 上去
  # （实测把 -scheme 解到过另一个 App target，归档出错误的 bundle，
  # 然后在 exportArchive 阶段以「requires a provisioning profile」报错）。
  # 现在工程里只剩这一个 App target，这段 scheme: 仍然要留着。
  #
  # 唯一 App：App Store，北京京微资易团队（8WKHZVR2W8），2026-09-05 起全球上架。
  # 证书/描述文件不走 sigh（私钥在本机 5-Tech/x-apple-jwzy/，非 fastlane 生成），
  # profile 是 ASC API 建的，名字是下面这个，别按 sigh 的命名模式找。
  # 注意：Distribution 证书 579SG95VN2 的公钥/SHA-1 已填进 App 备案，
  # 撤销重建证书 = 必须同步做备案变更（见 5-Tech/EXTERNAL_SERVICES.md §6.7）。
  # bundle id 里的 .cn 后缀不可改：它与 App 备案绑定。
  Workdeck:
    templates: [WorkdeckApp]
    scheme:
      configVariants: []
      testTargets: [WorkdeckTests, WorkdeckUITests]
      # 模拟器里测内购：这份本地商品表顶替 App Store（dev-board#426）。三档与 ASC 上的
      # credits.cny.50/100/300 逐个对应，价格也一致，走查时购买弹层走沙盒确认、不真扣款。
      # 只影响 Debug 运行，归档发版走真实 App Store。
      storeKitConfiguration: Workdeck.storekit
    dependencies:
      - target: WorkdeckLiveActivity
      - target: WorkdeckWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aiworkdeck.mobile.cn
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: "AI WorkDeck AppStore"

  # 扩展的描述文件与主 App 一样由人在 ASC 手建（不走 sigh），
  # 名字就是下面这个；CI 经 LA_PROFILE_B64 secret 装入（见 Fastfile ci_appstore）。
  WorkdeckLiveActivity:
    templates: [LiveActivityExt]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aiworkdeck.mobile.cn.LiveActivity
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: "AI WorkDeck LiveActivity AppStore"

  # 纯逻辑单测（阶段映射、图集分组、删除文案）。不参与 fastlane 归档。
  WorkdeckTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: ../contract/fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Workdeck
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

  WorkdeckUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Workdeck
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        TEST_TARGET_NAME: Workdeck

  WorkdeckWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Watch
      - path: WatchShared
      - path: WatchResources
      - path: Sources/Contract/Strings.swift
      - path: Sources/Contract/Tokens.swift
      - path: Sources/Design/L10n.swift
      - path: Sources/Design/Typography.swift
    scheme:
      configVariants: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aiworkdeck.mobile.cn.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGNING_ALLOWED: NO
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          "CODE_SIGN_IDENTITY[sdk=watchos*]": "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "AI WorkDeck Watch AppStore"
    info:
      path: Info-Watch.plist
      properties:
        CFBundleDisplayName: AI WorkDeck
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.aiworkdeck.mobile.cn
        WKRunsIndependentlyOfCompanionApp: false
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: 录制音频并自动同步到配对 iPhone 中的 AI WorkDeck。
        UIBackgroundModes:
          - audio
